name: personal_hymns_library
description: Offline personal hymns library built with Flutter, SQLite, and Material 3.
publish_to: "none"
version: 1.0.0+1

environment:
  sdk: ">=3.5.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  cupertino_icons: ^1.0.8
  file_picker: ^11.0.2
  image_picker: ^1.1.2
  just_audio: ^0.9.42
  path: ^1.9.0
  path_provider: ^2.1.5
  provider: ^6.1.2
  shared_preferences: ^2.3.4
  sqflite: ^2.4.1
  url_launcher: ^6.3.1
  video_player: ^2.9.2
  pdf: ^3.12.0
  wakelock_plus: ^1.5.2
  archive: ^4.0.9

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/fonts/DejaVuSans.ttf
    - assets/fonts/DejaVuSans-Bold.ttf
    - tasbe7naDB.json
    - piano_scale_images_pianoscales_org/
    - piano_scale_images_pianoscales_org/basic_chords/major/
    - piano_scale_images_pianoscales_org/basic_chords/minor/
    - piano_scale_images_pianoscales_org/basic_chords/inversions/major/first/
    - piano_scale_images_pianoscales_org/basic_chords/inversions/major/second/
    - piano_scale_images_pianoscales_org/basic_chords/inversions/minor/first/
    - piano_scale_images_pianoscales_org/basic_chords/inversions/minor/second/
    - piano_scale_images_pianoscales_org/diminished_chords/diminished_triad/
    - piano_scale_images_pianoscales_org/diminished_chords/diminished_7/
    - piano_scale_images_pianoscales_org/diminished_chords/half_diminished_7/
    - piano_scale_images_pianoscales_org/diminished_chords/inversions/diminished_triad/first/
    - piano_scale_images_pianoscales_org/diminished_chords/inversions/diminished_triad/second/
    - piano_scale_images_pianoscales_org/diminished_chords/inversions/diminished_7/first/
    - piano_scale_images_pianoscales_org/diminished_chords/inversions/diminished_7/second/
    - piano_scale_images_pianoscales_org/diminished_chords/inversions/diminished_7/third/
    - piano_scale_images_pianoscales_org/diminished_chords/inversions/half_diminished_7/first/
    - piano_scale_images_pianoscales_org/diminished_chords/inversions/half_diminished_7/second/
    - piano_scale_images_pianoscales_org/diminished_chords/inversions/half_diminished_7/third/
    - piano_scale_images_pianoscales_org/scales/major/
    - piano_scale_images_pianoscales_org/scales/minor_natural/
    - piano_scale_images_pianoscales_org/seventh_chords/major_7/
    - piano_scale_images_pianoscales_org/seventh_chords/minor_7/
    - piano_scale_images_pianoscales_org/seventh_chords/inversions/major_7/first/
    - piano_scale_images_pianoscales_org/seventh_chords/inversions/major_7/second/
    - piano_scale_images_pianoscales_org/seventh_chords/inversions/major_7/third/
    - piano_scale_images_pianoscales_org/seventh_chords/inversions/minor_7/first/
    - piano_scale_images_pianoscales_org/seventh_chords/inversions/minor_7/second/
    - piano_scale_images_pianoscales_org/seventh_chords/inversions/minor_7/third/
